    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "WebApplication",
      "name": "Small Steps",
      "url": "https://small-steps-seven.vercel.app",
      "description": "A gentle journal for people recovering from burnout. One quiet step a day — no streaks, no guilt.",
      "applicationCategory": "HealthApplication",
      "operatingSystem": "Web",
      "offers": {
        "@type": "Offer",
        "price": "0",
        "priceCurrency": "USD",
        "description": "Free tier with optional $48/year Private plan"
      },
      "featureList": [
        "AI-powered warm replies",
        "Mood and category tracking",
        "Journey timeline",
        "Growth plant visualization",
        "Progress heatmap",
        "Daily reminders",
        "Weekly email summaries"
      ]
    }
    </script>
    <script>
      (function () {
        var theme = "light";
        try {
          var pref = localStorage.getItem("theme-preference");
          if (pref === "dark") {
            theme = "dark";
          } else if (
            pref !== "light" &&
            window.matchMedia("(prefers-color-scheme: dark)").matches
          ) {
            theme = "dark";
          }
        } catch (e) {
          /* storage unavailable — fall back to light */
        }
        document.documentElement.dataset.theme = theme;
      })();
    </script>
